<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Report Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <h1>🧪 Simple Report Test</h1>
    <div id="status" class="status info">Testing...</div>
    
    <button onclick="testSimpleCSV()">Test Simple CSV</button>
    <button onclick="testSimplePDF()">Test Simple PDF</button>
    <button onclick="testDatabaseConnection()">Test Database</button>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <script src="js/firebase-config.js"></script>
    <script src="js/admin/report-generator.js"></script>
    
    <script>
        function updateStatus(message, type) {
            document.getElementById('status').textContent = message;
            document.getElementById('status').className = `status ${type}`;
        }

        function testSimpleCSV() {
            try {
                const testData = [
                    { 'Name': 'Test Product', 'Price': '$99.99', 'Stock': '10' },
                    { 'Name': 'Another Product', 'Price': '$49.99', 'Stock': '25' }
                ];
                
                const headers = ['Name', 'Price', 'Stock'];
                const filename = `simple-test-${Date.now()}`;
                
                // Create CSV
                let csvContent = headers.join(',') + '\n';
                testData.forEach(row => {
                    const values = headers.map(header => {
                        const value = row[header] || '';
                        const escapedValue = String(value).replace(/"/g, '""');
                        return `"${escapedValue}"`;
                    });
                    csvContent += values.join(',') + '\n';
                });
                
                // Download
                const blob = new Blob([csvContent], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `${filename}.csv`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                window.URL.revokeObjectURL(url);
                
                updateStatus('✅ CSV test successful!', 'success');
                
            } catch (error) {
                updateStatus(`❌ CSV test failed: ${error.message}`, 'error');
            }
        }

        function testSimplePDF() {
            try {
                const htmlContent = `
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <title>Test PDF</title>
                        <style>
                            body { font-family: Arial, sans-serif; margin: 20px; }
                            h1 { color: #333; }
                            table { width: 100%; border-collapse: collapse; margin: 20px 0; }
                            th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
                            th { background-color: #f5f5f5; font-weight: bold; }
                        </style>
                    </head>
                    <body>
                        <h1>Test Report</h1>
                        <p>Generated on: ${new Date().toLocaleString()}</p>
                        <table>
                            <tr>
                                <th>Name</th>
                                <th>Price</th>
                                <th>Stock</th>
                            </tr>
                            <tr>
                                <td>Test Product</td>
                                <td>$99.99</td>
                                <td>10</td>
                            </tr>
                            <tr>
                                <td>Another Product</td>
                                <td>$49.99</td>
                                <td>25</td>
                            </tr>
                        </table>
                    </body>
                    </html>
                `;
                
                const printWindow = window.open('', '_blank');
                printWindow.document.write(htmlContent);
                printWindow.document.close();
                
                updateStatus('✅ PDF test successful!', 'success');
                
            } catch (error) {
                updateStatus(`❌ PDF test failed: ${error.message}`, 'error');
            }
        }

        async function testDatabaseConnection() {
            try {
                updateStatus('Testing database connection...', 'info');
                
                // Test basic database access
                const productsSnapshot = await db.collection('products').limit(1).get();
                const ordersSnapshot = await db.collection('orders').limit(1).get();
                
                updateStatus(`✅ Database connected! Products: ${productsSnapshot.size}, Orders: ${ordersSnapshot.size}`, 'success');
                
            } catch (error) {
                updateStatus(`❌ Database test failed: ${error.message}`, 'error');
            }
        }

        // Initialize
        window.onload = function() {
            updateStatus('Ready to test reports', 'info');
        };
    </script>
</body>
</html>
