        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        .log { background: #f8f9fa; padding: 10px; margin: 10px 0; border-radius: 5px; font-family: monospace; white-space: pre-wrap; max-height: 300px; overflow-y: auto; }

            <button onclick="testConnection()">Test Firebase Connection</button>
            <button onclick="uploadSampleData()">Upload Sample Products</button>
            <button onclick="createTestUser()">Create Test Admin User</button>

        function log(message) {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            logDiv.textContent += `[${timestamp}] ${message}\n`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function updateStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
        }

        async function testConnection() {
            log('Testing Firebase connection...');
            try {
                // Test Firestore connection
                const testDoc = await db.collection('test').doc('connection').set({
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    test: true
                });
                
                // Clean up test document
                await db.collection('test').doc('connection').delete();
                
                log('✅ Firebase connection successful!');
                updateStatus('Firebase connection successful!', 'success');
            } catch (error) {
                log(`❌ Firebase connection failed: ${error.message}`);
                updateStatus(`Firebase connection failed: ${error.message}`, 'error');
            }
        }

        async function uploadSampleData() {
            log('Starting sample data upload...');
            updateStatus('Uploading sample products...', 'info');
            
            try {
                let successCount = 0;
                let errorCount = 0;
                
                for (const product of sampleProducts) {
                    try {
                        await db.collection('products').add({
                            ...product,
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                        log(`✅ Added: ${product.name}`);
                        successCount++;
                    } catch (error) {
                        log(`❌ Failed to add ${product.name}: ${error.message}`);
                        errorCount++;
                    }
                }
                
                log(`\nUpload complete: ${successCount} successful, ${errorCount} failed`);
                updateStatus(`Sample data uploaded: ${successCount} products added`, 'success');
            } catch (error) {
                log(`❌ Upload failed: ${error.message}`);
                updateStatus(`Upload failed: ${error.message}`, 'error');
            }
        }

        async function createTestUser() {
            log('Creating test admin user...');
            updateStatus('Creating test admin user...', 'info');
            
            try {
                // Create test user in Firebase Auth
                const userCredential = await auth.createUserWithEmailAndPassword(
                    'admin@shophub.com',
                    'admin123456'
                );
                
                const user = userCredential.user;
                
                // Add user document to Firestore with admin role
                await db.collection('users').doc(user.uid).set({
                    name: 'Admin User',
                    email: 'admin@shophub.com',
                    role: 'admin',
                    phone: '+1234567890',
                    address: '123 Admin St, Admin City, AC 12345',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                log('✅ Test admin user created successfully!');
                log('   Email: admin@shophub.com');
                log('   Password: admin123456');
                updateStatus('Test admin user created!', 'success');
                
                // Sign out the user
                await auth.signOut();
            } catch (error) {
                if (error.code === 'auth/email-already-in-use') {
                    log('⚠️ Admin user already exists');
                    updateStatus('Admin user already exists', 'info');
                } else {
                    log(`❌ Failed to create admin user: ${error.message}`);
                    updateStatus(`Failed to create admin user: ${error.message}`, 'error');
                }
            }
        }

        async function checkData() {
            log('Checking data status...');
            updateStatus('Checking data status...', 'info');
            
            try {
                // Check products
                const productsSnapshot = await db.collection('products').get();
                log(`📦 Products: ${productsSnapshot.size} documents`);
                
                if (productsSnapshot.size > 0) {
                    const categories = new Set();
                    productsSnapshot.forEach(doc => {
                        categories.add(doc.data().category);
                    });
                    log(`📂 Categories: ${Array.from(categories).join(', ')}`);
                }
                
                // Check users
                const usersSnapshot = await db.collection('users').get();
                log(`👥 Users: ${usersSnapshot.size} documents`);
                
                usersSnapshot.forEach(doc => {
                    const userData = doc.data();
                    log(`   - ${userData.name} (${userData.email}) - Role: ${userData.role}`);
                });
                
                // Check orders
                const ordersSnapshot = await db.collection('orders').get();
                log(`🛒 Orders: ${ordersSnapshot.size} documents`);
                
                updateStatus('Data check complete', 'success');
            } catch (error) {
                log(`❌ Data check failed: ${error.message}`);
                updateStatus(`Data check failed: ${error.message}`, 'error');
            }
        }

        // Initialize
        log('Firebase Setup Tool Ready');
        updateStatus('Ready to setup Firebase. Click buttons to proceed.', 'info');
    </script>
</body>
