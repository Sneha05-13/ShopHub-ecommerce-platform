<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Test - ShopHub</title>
    <link rel="stylesheet" href="css/customer-style.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <h2>ShopHub</h2>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="html/customer/categories.html">Categories</a></li>
                <li><a href="html/customer/products.html">Products</a></li>
                <li><a href="html/customer/cart.html">Cart <span id="cart-count" class="badge">0</span></a></li>
                <li><a href="html/customer/profile.html" class="active">Profile</a></li>
                <li><a href="html/customer/login.html" id="auth-link">Login</a></li>
            </ul>
        </div>
    </nav>

    <!-- Profile Section -->
    <section class="profile-page">
        <div class="container">
            <h1>My Profile</h1>
            
            <div class="profile-content">
                <!-- User Info -->
                <div class="profile-card">
                    <h3>Account Information</h3>
                    <form id="profile-form">
                        <div class="form-group">
                            <label for="profile-name">Full Name</label>
                            <input type="text" id="profile-name" required>
                        </div>
                        <div class="form-group">
                            <label for="profile-email">Email</label>
                            <input type="email" id="profile-email" disabled>
                        </div>
                        <div class="form-group">
                            <label for="profile-phone">Phone</label>
                            <input type="tel" id="profile-phone">
                        </div>
                        <div class="form-group">
                            <label for="profile-address">Address</label>
                            <textarea id="profile-address" rows="3"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Update Profile</button>
                        <button type="button" class="btn btn-secondary" id="logout-btn">Logout</button>
                    </form>
                </div>

                <!-- Order History -->
                <div class="profile-card">
                    <h3>Order History</h3>
                    <div id="order-history">
                        <p>Loading order history...</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 ShopHub. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- Custom Scripts -->
    <script src="js/firebase-config.js"></script>
    <script src="js/customer/auth.js"></script>
    <script>
        console.log('Test profile page loaded');
        
        // Test basic functionality
        document.addEventListener('DOMContentLoaded', () => {
            console.log('DOM loaded');
            
            // Test form elements
            const nameInput = document.getElementById('profile-name');
            const emailInput = document.getElementById('profile-email');
            const phoneInput = document.getElementById('profile-phone');
            const addressInput = document.getElementById('profile-address');
            
            console.log('Form elements found:', {
                name: !!nameInput,
                email: !!emailInput,
                phone: !!phoneInput,
                address: !!addressInput
            });
        });
    </script>
</body>
</html>
