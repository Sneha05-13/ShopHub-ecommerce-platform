<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Reports</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        .log { background: #f8f9fa; padding: 10px; margin: 10px 0; border-radius: 5px; font-family: monospace; white-space: pre-wrap; max-height: 400px; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Test Report Generation</h1>
        
        <div id="status" class="status info">
            Ready to test reports...
        </div>
        
        <div>
            <h3>Dashboard Reports</h3>
            <button onclick="testDashboardReport('csv')">Dashboard Summary (CSV)</button>
            <button onclick="testDashboardReport('pdf')">Dashboard Summary (PDF)</button>
        </div>
        
        <div>
            <h3>Products Reports</h3>
            <button onclick="testProductsReport('csv')">Products (CSV)</button>
            <button onclick="testProductsReport('pdf')">Products (PDF)</button>
        </div>
        
        <div>
            <h3>Orders Reports</h3>
            <button onclick="testOrdersReport('csv')">Orders (CSV)</button>
            <button onclick="testOrdersReport('pdf')">Orders (PDF)</button>
        </div>
        
        <div>
            <h3>Sales Reports</h3>
            <button onclick="testSalesReport('csv')">Sales Summary (CSV)</button>
            <button onclick="testSalesReport('pdf')">Sales Summary (PDF)</button>
        </div>
        
        <div id="log" class="log"></div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBfo7mj_kEFklzaB81x9YcuMim14rnZULU",
            authDomain: "e-commerce-app-f265d.firebaseapp.com",
            projectId: "e-commerce-app-f265d",
            storageBucket: "e-commerce-app-f265d.firebasestorage.app",
            messagingSenderId: "927599274842",
            appId: "1:927599274842:web:37ea0993336bc879d82163",
            measurementId: "G-5KN3XX4QWX"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function log(message) {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            logDiv.textContent += `[${timestamp}] ${message}\n`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function updateStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
        }

        async function testDashboardReport(format) {
            log(`Testing Dashboard Report (${format})...`);
            updateStatus('Testing dashboard report...', 'info');
            
            try {
                // Simple test data
                const testData = [
                    { 'Metric': 'Total Products', 'Value': '100', 'Description': 'Number of products' },
                    { 'Metric': 'Total Orders', 'Value': '50', 'Description': 'Number of orders' }
                ];
                
                const headers = ['Metric', 'Value', 'Description'];
                const filename = `test-dashboard-${Date.now()}`;
                
                if (format === 'pdf') {
                    // Simple PDF test
                    const htmlContent = `
                        <!DOCTYPE html>
                        <html>
                        <head>
                            <title>Test Dashboard Report</title>
                            <style>
                                body { font-family: Arial, sans-serif; margin: 20px; }
                                h1 { color: #333; }
                                table { width: 100%; border-collapse: collapse; margin: 20px 0; }
                                th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
                                th { background-color: #f5f5f5; font-weight: bold; }
                            </style>
                        </head>
                        <body>
                            <h1>Test Dashboard Report</h1>
                            <p>Generated on: ${new Date().toLocaleString()}</p>
                            <table>
                                <thead>
                                    <tr>
                                        <th>Metric</th>
                                        <th>Value</th>
                                        <th>Description</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td>Total Products</td>
                                        <td>100</td>
                                        <td>Number of products</td>
                                    </tr>
                                    <tr>
                                        <td>Total Orders</td>
                                        <td>50</td>
                                        <td>Number of orders</td>
                                    </tr>
                                </tbody>
                            </table>
                        </body>
                        </html>
                    `;
                    
                    const printWindow = window.open('', '_blank');
                    printWindow.document.write(htmlContent);
                    printWindow.document.close();
                    log('✅ PDF report opened in new window');
                    
                } else {
                    // CSV test
                    let csvContent = headers.join(',') + '\n';
                    testData.forEach(row => {
                        const values = headers.map(header => {
                            const value = row[header] || '';
                            const escapedValue = String(value).replace(/"/g, '""');
                            return `"${escapedValue}"`;
                        });
                        csvContent += values.join(',') + '\n';
                    });
                    
                    // Download CSV
                    const blob = new Blob([csvContent], { type: 'text/csv' });
                    const url = window.URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = `${filename}.csv`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    window.URL.revokeObjectURL(url);
                    
                    log('✅ CSV report downloaded successfully');
                }
                
                updateStatus('Test completed successfully', 'success');
                
            } catch (error) {
                log(`❌ Error: ${error.message}`);
                updateStatus(`Error: ${error.message}`, 'error');
            }
        }

                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    window.URL.revokeObjectURL(url);
                    
                    log('✅ CSV report downloaded successfully');
                }
                
                updateStatus('Test completed successfully', 'success');
                
            } catch (error) {
                log(`❌ Error: ${error.message}`);
                updateStatus(`Error: ${error.message}`, 'error');
            }
        }

        // Initialize
        log('🧪 Report Test Tool Ready');
        updateStatus('Ready to test reports', 'info');
    </script>
</body>
</html>
