<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - ShopHub</title>
    <link rel="stylesheet" href="../../css/customer-style.css">
    <style>
        /* Clean navbar styling */
        .navbar {
            display: block !important;
            background: #2c3e50 !important;
            color: white !important;
            padding: 1rem 0 !important;
            position: relative !important;
            z-index: 1000 !important;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1) !important;
        }

        .navbar .container {
            display: flex !important;
            justify-content: space-between !important;
            align-items: center !important;
            padding: 0 20px !important;
        }

        .logo h2 {
            color: #3498db !important;
            display: block !important;
            font-size: 1.8rem !important;
            margin: 0 !important;
        }

        .nav-links {
            display: flex !important;
            list-style: none !important;
            gap: 2rem !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        .nav-links li {
            display: inline-block !important;
            margin: 0 !important;
        }

        .nav-links a {
            color: white !important;
            display: inline-block !important;
            text-decoration: none !important;
            padding: 0.5rem 0 !important;
            transition: color 0.3s !important;
        }

        .nav-links a:hover {
            color: #3498db !important;
        }

        /* Mobile menu styles */
        @media (max-width: 768px) {
            .mobile-menu-icon {
                display: flex !important;
                flex-direction: column !important;
                cursor: pointer !important;
                padding: 0.5rem !important;
                background: rgba(255, 255, 255, 0.1) !important;
                border-radius: 4px !important;
            }

            .mobile-menu-icon span {
                width: 25px !important;
                height: 3px !important;
                background-color: white !important;
                margin: 3px 0 !important;
                transition: all 0.3s ease-in-out !important;
                border-radius: 2px !important;
                display: block !important;
            }

            .mobile-menu-icon.active span:nth-child(1) {
                transform: rotate(-45deg) translate(-5px, 6px) !important;
            }

            .mobile-menu-icon.active span:nth-child(2) {
                opacity: 0 !important;
            }

            .mobile-menu-icon.active span:nth-child(3) {
                transform: rotate(45deg) translate(-5px, -6px) !important;
            }

            .nav-links {
                display: none !important;
                position: absolute !important;
                top: 100% !important;
                left: 0 !important;
                right: 0 !important;
                background: #2c3e50 !important;
                flex-direction: column !important;
                padding: 1rem 0 !important;
                z-index: 999 !important;
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2) !important;
                border-top: 1px solid #34495e !important;
            }

            .nav-links.active {
                display: flex !important;
            }

            .nav-links li {
                display: block !important;
                margin: 0 !important;
                width: 100% !important;
            }

            .nav-links a {
                display: block !important;
                padding: 1rem 20px !important;
                color: white !important;
                text-decoration: none !important;
                border-bottom: 1px solid #34495e !important;
                font-size: 1rem !important;
            }

            .nav-links a:hover {
                background: #34495e !important;
                color: #3498db !important;
            }
        }
    </style>
</head>

<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <h2>ShopHub</h2>
            </div>
            <ul class="nav-links">
                <li><a href="../../index.html">Home</a></li>
                <li><a href="categories.html">Categories</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="cart.html" class="active">Cart <span id="cart-count" class="badge">0</span></a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="login.html" id="auth-link">Login</a></li>
            </ul>
            <div class="mobile-menu-icon" id="mobile-menu-icon">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <!-- Cart Section -->
    <section class="cart-page">
        <div class="container">
            <h1>Shopping Cart</h1>

            <div class="cart-content">
                <!-- Cart Items -->
                <div class="cart-items" id="cart-items">
                    <!-- Cart items will be loaded here by JavaScript -->
                </div>

                <!-- Payment and Summary Row -->
                <div class="payment-and-summary">
                    <!-- Payment Section -->
                    <div class="payment-section">
                        <h3>Payment Method</h3>
                        <div class="payment-options">
                            <label class="payment-option">
                                <input type="radio" name="payment-method" value="cod" checked>
                                <span class="option-content">
                                    <span class="option-icon">💵</span>
                                    <span class="option-details">
                                        <span class="option-title">Cash on Delivery</span>
                                        <span class="option-desc">Pay when you receive the order</span>
                                    </span>
                                </span>
                            </label>

                            <label class="payment-option">
                                <input type="radio" name="payment-method" value="card">
                                <span class="option-content">
                                    <span class="option-icon">💳</span>
                                    <span class="option-details">
                                        <span class="option-title">Credit / Debit Card</span>
                                        <span class="option-desc">Secure payment with Stripe</span>
                                    </span>
                                </span>
                            </label>

                            <label class="payment-option">
                                <input type="radio" name="payment-method" value="stripe">
                                <span class="option-content">
                                    <span class="option-icon">💳</span>
                                    <span class="option-details">
                                        <span class="option-title">Stripe</span>
                                        <span class="option-desc">Modern card processing</span>
                                    </span>
                                </span>
                            </label>

                            <label class="payment-option">
                                <input type="radio" name="payment-method" value="paypal">
                                <span class="option-content">
                                    <span class="option-icon">🅿️</span>
                                    <span class="option-details">
                                        <span class="option-title">PayPal</span>
                                        <span class="option-desc">Fast and secure global payments</span>
                                    </span>
                                </span>
                            </label>
                        </div>

                        <!-- Card Details (Hidden by default) -->
                        <div id="card-details" class="payment-details-container" style="display: none;">
                            <div class="form-group">
                                <label>Card Number</label>
                                <input type="text" id="card-number" placeholder="0000 0000 0000 0000" maxlength="19">
                            </div>
                            <div class="form-group">
                                <label>Country</label>
                                <select id="card-country">
                                    <option value="US">United States</option>
                                    <option value="GB">United Kingdom</option>
                                    <option value="IN" selected>India</option>
                                    <option value="CA">Canada</option>
                                    <option value="AU">Australia</option>
                                    <option value="DE">Germany</option>
                                    <option value="FR">France</option>
                                </select>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Expiry Date</label>
                                    <input type="text" id="card-expiry" placeholder="MM/YY" maxlength="5">
                                </div>
                                <div class="form-group">
                                    <label>CVV</label>
                                    <input type="password" id="card-cvv" placeholder="***" maxlength="3">
                                </div>
                            </div>
                        </div>

                        <!-- PayPal Details (Hidden by default) -->
                        <div id="paypal-details" class="payment-details-container" style="display: none;">
                            <div class="paypal-info">
                                <p>You will be redirected to PayPal to complete your purchase safely.</p>
                                <div class="form-group">
                                    <label>PayPal Email / Account</label>
                                    <input type="email" id="paypal-email" placeholder="example@email.com">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Cart Summary -->
                    <div class="cart-summary">
                        <h3>Order Summary</h3>
                        <div class="summary-row">
                            <span>Subtotal:</span>
                            <span id="cart-subtotal">$0.00</span>
                        </div>
                        <div class="summary-row">
                            <span>Tax (10%):</span>
                            <span id="cart-tax">$0.00</span>
                        </div>
                        <div class="summary-row total">
                            <span>Total:</span>
                            <span id="cart-total">$0.00</span>
                        </div>
                        <button class="btn btn-primary btn-block" id="checkout-btn">Proceed to Checkout</button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 ShopHub. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <!-- Custom Scripts -->
    <script src="../../js/firebase-config.js"></script>
    <script src="../../js/customer/auth.js"></script>
    <script src="../../js/customer/mobile-menu.js"></script>
    <script src="../../js/customer/cart.js"></script>
</body>

</html>
