<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories - ShopHub</title>
    <link rel="stylesheet" href="../../css/customer-style.css">
    <style>
        /* Clean navbar styling */
        .navbar {
            display: block !important;
            background: #2c3e50 !important;
            color: white !important;
            padding: 1rem 0 !important;
            position: relative !important;
            z-index: 1000 !important;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1) !important;
        }
        
        .navbar .container {
            display: flex !important;
            justify-content: space-between !important;
            align-items: center !important;
            padding: 0 20px !important;
        }
        
        .logo h2 {
            color: #3498db !important;
            display: block !important;
            font-size: 1.8rem !important;
            margin: 0 !important;
        }
        
        .nav-links {
            display: flex !important;
            list-style: none !important;
            gap: 2rem !important;
            margin: 0 !important;
            padding: 0 !important;
        }
        
        .nav-links li {
            display: inline-block !important;
            margin: 0 !important;
        }
        
        .nav-links a {
            color: white !important;
            display: inline-block !important;
            text-decoration: none !important;
            padding: 0.5rem 0 !important;
            transition: color 0.3s !important;
        }
        
        .nav-links a:hover {
            color: #3498db !important;
        }
        
        /* Mobile menu styles */
        @media (max-width: 768px) {
            .mobile-menu-icon {
                display: flex !important;
                flex-direction: column !important;
                cursor: pointer !important;
                padding: 0.5rem !important;
                background: rgba(255,255,255,0.1) !important;
                border-radius: 4px !important;
            }
            
            .mobile-menu-icon span {
                width: 25px !important;
                height: 3px !important;
                background-color: white !important;
                margin: 3px 0 !important;
                transition: all 0.3s ease-in-out !important;
                border-radius: 2px !important;
                display: block !important;
            }
            
            .mobile-menu-icon.active span:nth-child(1) {
                transform: rotate(-45deg) translate(-5px, 6px) !important;
            }
            
            .mobile-menu-icon.active span:nth-child(2) {
                opacity: 0 !important;
            }
            
            .mobile-menu-icon.active span:nth-child(3) {
                transform: rotate(45deg) translate(-5px, -6px) !important;
            }
            
            .nav-links {
                display: none !important;
                position: absolute !important;
                top: 100% !important;
                left: 0 !important;
                right: 0 !important;
                background: #2c3e50 !important;
                flex-direction: column !important;
                padding: 1rem 0 !important;
                z-index: 999 !important;
                box-shadow: 0 5px 15px rgba(0,0,0,0.2) !important;
                border-top: 1px solid #34495e !important;
            }
            
            .nav-links.active,
            .nav-links.mobile-active {
                display: flex !important;
            }
            
            .nav-links li {
                display: block !important;
                margin: 0 !important;
                width: 100% !important;
            }
            
            .nav-links a {
                display: block !important;
                padding: 1rem 20px !important;
                color: white !important;
                text-decoration: none !important;
                border-bottom: 1px solid #34495e !important;
                font-size: 1rem !important;
            }
            
            .nav-links a:hover {
                background: #34495e !important;
                color: #3498db !important;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <h2>ShopHub</h2>
            </div>
            <ul class="nav-links">
                <li><a href="../../index.html">Home</a></li>
                <li><a href="categories.html" class="active">Categories</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="cart.html">Cart <span id="cart-count" class="badge">0</span></a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="login.html" id="auth-link">Login</a></li>
            </ul>
            <div class="mobile-menu-icon" id="mobile-menu-icon">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <!-- Categories Section -->
    <section class="categories-page">
        <div class="container">
            <h1>Shop by Category</h1>
            <div class="categories-grid" id="categories-grid">
                <!-- Categories will be loaded here by JavaScript -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 ShopHub. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- Custom Scripts -->
    <script src="../../js/firebase-config.js"></script>
    <script src="../../js/customer/auth.js"></script>
    <script src="../../js/customer/mobile-menu.js"></script>
    <script src="../../js/customer/categories.js"></script>
    
    <!-- Force Mobile Menu Script -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Categories page - forcing mobile menu');
            const mobileMenuIcon = document.getElementById('mobile-menu-icon');
            const navLinks = document.querySelector('.nav-links');
            
            if (mobileMenuIcon && navLinks) {
                mobileMenuIcon.addEventListener('click', function(e) {
                    e.preventDefault();
                    console.log('Mobile menu clicked!');
                    this.classList.toggle('active');
                    navLinks.classList.toggle('mobile-active');
                    console.log('Menu active:', navLinks.classList.contains('mobile-active'));
                });
                
                // Close menu when clicking outside
                document.addEventListener('click', function(e) {
                    if (!mobileMenuIcon.contains(e.target) && !navLinks.contains(e.target)) {
                        mobileMenuIcon.classList.remove('active');
                        navLinks.classList.remove('mobile-active');
                    }
                });
                
                // Close menu when clicking links
                navLinks.querySelectorAll('a').forEach(link => {
                    link.addEventListener('click', function() {
                        mobileMenuIcon.classList.remove('active');
                        navLinks.classList.remove('mobile-active');
                    });
                });
            }
        });
    </script>
    
    <!-- Debug Script -->
    <script>
        console.log('Categories page loaded');
        console.log('Window width:', window.innerWidth);
        console.log('Mobile menu icon:', document.getElementById('mobile-menu-icon'));
        console.log('Nav links:', document.querySelector('.nav-links'));
        
        // Force mobile menu functionality
        document.addEventListener('DOMContentLoaded', function() {
            const mobileMenuIcon = document.getElementById('mobile-menu-icon');
            const navLinks = document.querySelector('.nav-links');
            
            console.log('DOM loaded - Icon:', mobileMenuIcon);
            console.log('DOM loaded - Nav:', navLinks);
            
            if (mobileMenuIcon) {
                mobileMenuIcon.addEventListener('click', function() {
                    console.log('Mobile menu clicked!');
                    this.classList.toggle('active');
                    navLinks.classList.toggle('active');
                    console.log('Icon classes:', this.className);
                    console.log('Nav classes:', navLinks.className);
                });
            }
        });
    </script>
</body>
</html>
