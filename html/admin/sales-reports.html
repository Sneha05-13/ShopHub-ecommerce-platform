<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Reports - ShopHub</title>
    <link rel="stylesheet" href="../../css/admin-style.css">
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar Navigation -->
        <aside class="admin-sidebar">
            <div class="sidebar-header">
                <h2>ShopHub Admin</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <span>📊</span> Dashboard
                </a>
                <a href="products.html" class="nav-item">
                    <span>📦</span> Products
                </a>
                <a href="orders.html" class="nav-item">
                    <span>🛒</span> Orders
                </a>
                <a href="sales-reports.html" class="nav-item active">
                    <span>📈</span> Sales Reports
                </a>
                <a href="../../index.html" class="nav-item">
                    <span>🏠</span> Back to Store
                </a>
                <a href="#" class="nav-item" id="admin-logout">
                    <span>🚪</span> Logout
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="admin-main">
            <header class="admin-header">
                <h1>Sales Reports</h1>
            </header>

            <div class="admin-content">
                <!-- Report Buttons -->
                <div class="admin-section">
                    <h2>Export Reports</h2>
                    <div class="report-buttons">
                        <button class="btn btn-secondary" onclick="salesReports.generateSalesReport('csv')">
                            💰 Sales Summary (CSV)
                        </button>
                        <button class="btn btn-secondary" onclick="salesReports.generateSalesReport('pdf')">
                            📄 Sales Summary (PDF)
                        </button>
                        <button class="btn btn-secondary" onclick="salesReports.generateSalesByCategoryReport('csv')">
                            📊 Sales by Category (CSV)
                        </button>
                        <button class="btn btn-secondary" onclick="salesReports.generateSalesByCategoryReport('pdf')">
                            📄 Sales by Category (PDF)
                        </button>
                        <button class="btn btn-secondary" onclick="salesReports.generateTopProductsReport('csv')">
                            🏆 Top Products (CSV)
                        </button>
                        <button class="btn btn-secondary" onclick="salesReports.generateTopProductsReport('pdf')">
                            📄 Top Products (PDF)
                        </button>
                    </div>
                </div>
                <!-- Summary Cards -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3>Total Sales</h3>
                        <p class="stat-value" id="total-sales">$0.00</p>
                    </div>
                    <div class="stat-card">
                        <h3>Total Orders</h3>
                        <p class="stat-value" id="total-orders-count">0</p>
                    </div>
                    <div class="stat-card">
                        <h3>Average Order Value</h3>
                        <p class="stat-value" id="average-order-value">$0.00</p>
                    </div>
                    <div class="stat-card">
                        <h3>Products Sold</h3>
                        <p class="stat-value" id="products-sold">0</p>
                    </div>
                </div>

                <!-- Sales by Category -->
                <div class="admin-section">
                    <h2>Sales by Category</h2>
                    <div class="table-responsive">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>Category</th>
                                    <th>Units Sold</th>
                                    <th>Revenue</th>
                                </tr>
                            </thead>
                            <tbody id="category-sales">
                                <!-- Category sales will be loaded here -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Top Selling Products -->
                <div class="admin-section">
                    <h2>Top Selling Products</h2>
                    <div class="table-responsive">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>Product</th>
                                    <th>Units Sold</th>
                                    <th>Revenue</th>
                                </tr>
                            </thead>
                            <tbody id="top-products">
                                <!-- Top products will be loaded here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- Custom Scripts -->
    <script src="../../js/firebase-config.js"></script>
    <script src="../../js/admin/admin-auth.js"></script>
    <script src="../../js/admin/sales-reports.js"></script>
    <script src="../../js/admin/report-generator.js"></script>
</body>
</html>
