<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - ShopHub</title>
    <link rel="stylesheet" href="../../css/admin-style.css">
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar Navigation -->
        <aside class="admin-sidebar">
            <div class="sidebar-header">
                <h2>ShopHub Admin</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item active">
                    <span>📊</span> Dashboard
                </a>
                <a href="products.html" class="nav-item">
                    <span>📦</span> Products
                </a>
                <a href="orders.html" class="nav-item">
                    <span>🛒</span> Orders
                </a>
                <a href="sales-reports.html" class="nav-item">
                    <span>📈</span> Sales Reports
                </a>
                <a href="../../index.html" class="nav-item">
                    <span>🏠</span> Back to Store
                </a>
                <a href="#" class="nav-item" id="admin-logout">
                    <span>🚪</span> Logout
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="admin-main">
            <header class="admin-header">
                <h1>Dashboard</h1>
                <div class="admin-user">
                    <span id="admin-user-name">Admin</span>
                </div>
            </header>

            <div class="admin-content">
                <!-- Report Buttons -->
                <div class="admin-section">
                    <h2>Reports</h2>
                    <div class="report-buttons">
                        <button class="btn btn-secondary" onclick="dashboardReports.generateDashboardReport('csv')">
                            📊 Dashboard Summary (CSV)
                        </button>
                        <button class="btn btn-secondary" onclick="dashboardReports.generateDashboardReport('pdf')">
                            📄 Dashboard Summary (PDF)
                        </button>
                        <button class="btn btn-secondary" onclick="dashboardReports.generateRecentOrdersReport('csv')">
                            📋 Recent Orders (CSV)
                        </button>
                        <button class="btn btn-secondary" onclick="dashboardReports.generateRecentOrdersReport('pdf')">
                            📄 Recent Orders (PDF)
                        </button>
                    </div>
                </div>
                <!-- Statistics Cards -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3>Total Products</h3>
                        <p class="stat-value" id="total-products">0</p>
                    </div>
                    <div class="stat-card">
                        <h3>Total Orders</h3>
                        <p class="stat-value" id="total-orders">0</p>
                    </div>
                    <div class="stat-card">
                        <h3>Total Revenue</h3>
                        <p class="stat-value" id="total-revenue">$0.00</p>
                    </div>
                    <div class="stat-card">
                        <h3>Total Customers</h3>
                        <p class="stat-value" id="total-customers">0</p>
                    </div>
                </div>

                <!-- Recent Orders -->
                <div class="admin-section">
                    <h2>Recent Orders</h2>
                    <div class="table-responsive">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>Order ID</th>
                                    <th>Customer</th>
                                    <th>Date</th>
                                    <th>Total</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="recent-orders">
                                <!-- Recent orders will be loaded here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- Custom Scripts -->
    <script src="../../js/firebase-config.js"></script>
    <script src="../../js/admin/admin-auth.js"></script>
    <script src="../../js/admin/dashboard.js"></script>
    <script src="../../js/admin/report-generator.js"></script>
</body>
</html>
